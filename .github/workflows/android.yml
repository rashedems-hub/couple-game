name: Android app

# Builds the signed .aab for Google Play and attaches it to a GitHub release.
# Run it from the Actions tab ("Run workflow").
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version shown in the store (e.g. 1.0)'
        required: true
        default: '1.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build && npx cap sync android
      - name: Check the app builds (no signing key yet)
        if: env.HAS_KEY != 'true'
        working-directory: android
        run: |
          echo "::warning::ANDROID_KEYSTORE_PASSWORD secret is missing, so this run only checks the build and publishes nothing"
          ./gradlew --no-daemon bundleRelease
      - name: Decrypt upload key
        if: env.HAS_KEY == 'true'
        env:
          PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:PASS -in android/upload-key.jks.enc -out "$RUNNER_TEMP/upload.jks"
      - name: Build signed bundle
        if: env.HAS_KEY == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: ./gradlew --no-daemon bundleRelease assembleRelease
      - name: Publish release
        if: env.HAS_KEY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/bundle/release/app-release.aab halalii-${{ inputs.version_name }}-${{ github.run_number }}.aab
          cp android/app/build/outputs/apk/release/app-release.apk halalii-${{ inputs.version_name }}-${{ github.run_number }}.apk
          gh release create "android-${{ github.run_number }}" halalii-*.aab halalii-*.apk \
            --title "حلالي أندرويد ${{ inputs.version_name }} (${{ github.run_number }})" \
            --notes "ارفع ملف .aab على Google Play Console. ملف .apk للتجربة المباشرة على الجوال."

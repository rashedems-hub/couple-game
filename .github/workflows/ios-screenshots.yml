name: iOS screenshots

# Uploads the iPhone screenshots in fastlane/screenshots/<language>/ to the
# App Store version that is being prepared. Run it from the Actions tab.
on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          python3 - <<'PY'
          import json, os
          json.dump({"key_id": os.environ["ASC_KEY_ID"], "issuer_id": os.environ["ASC_ISSUER_ID"],
                     "key": os.environ["ASC_KEY_P8"], "in_house": False},
                    open(os.path.join(os.environ["RUNNER_TEMP"], "asc_api_key.json"), "w"))
          PY
      - name: Upload screenshots
        run: |
          fastlane deliver --api_key_path "$RUNNER_TEMP/asc_api_key.json" \
            --app_identifier com.halalii.app --platform ios \
            --screenshots_path fastlane/screenshots --overwrite_screenshots true \
            --skip_binary_upload true --skip_metadata true --skip_app_version_update true \
            --submit_for_review false --force true --run_precheck_before_submit false
      - name: Remove key
        if: always()
        run: rm -f "$RUNNER_TEMP/asc_api_key.json"
